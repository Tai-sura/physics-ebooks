<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>力偶（couple）· 力偶矩與支點位置無關（jpfm08 p7）</title>
<style>
  :root { --ink:#23231f; --ink2:#63635a; --line:#dcd7ca; --card:#fffefb; --accent:#2f6fbf; --amber:#b47a17; --red:#b03c2c; --green:#2e7d5b; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:#f4f1ea; color:var(--ink);
    font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; }
  .app { display:grid; grid-template-columns:minmax(0,1fr) 336px; gap:18px;
    max-width:1180px; margin:0 auto; padding:12px 14px 10px; }
  .stage { min-width:0; }
  #stage { background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:6px; touch-action:none; cursor:ew-resize; }
  #canvas-holder { display:block; line-height:0; }
  #canvas-holder canvas { display:block; width:100% !important; height:auto !important; border-radius:4px; }
  .panel { display:flex; flex-direction:column; gap:9px; min-width:0; }
  .panel h1 { font-size:18px; margin:0; font-weight:600; }
  .panel p { margin:0; font-size:12.5px; color:var(--ink2); }
  .btns { display:flex; gap:6px; }
  .btns button { flex:1; font:inherit; font-size:12.5px; padding:7px 4px; border-radius:6px;
    border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  .btns button:hover { background:#f6f3ec; }
  .btns button.on { border-color:var(--accent); color:var(--accent); }
  .btns button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .row { display:flex; align-items:center; gap:8px; }
  .row label { width:96px; flex:none; color:var(--ink2); font-size:12px; }
  .row input[type=range] { flex:1; min-width:0; accent-color:var(--accent); height:18px; }
  .row .val { width:66px; flex:none; text-align:right; font:inherit; font-size:12.5px;
    font-variant-numeric:tabular-nums; padding:3px 4px; border:1px solid var(--line); border-radius:5px;
    background:#fff; color:var(--ink); }
  .row.hide { display:none; }
  .read { border-top:1px solid var(--line); padding-top:8px; display:grid; gap:3px; }
  .read div { display:flex; justify-content:space-between; gap:8px; font-size:13px; font-variant-numeric:tabular-nums; }
  .read span:first-child { color:var(--ink2); }
  .read b { font-weight:500; }
  .read .big b { font-weight:600; }
  .eq { display:block !important; font-size:12.5px; line-height:1.45; font-variant-numeric:tabular-nums;
    padding:5px 7px; border-radius:5px; background:#f3f6fb; color:var(--accent); }
  .eq.warn { background:#fbeeea; color:var(--red); }
  .key { font-size:13px; font-weight:600; color:var(--green); }
  .key.warn { color:var(--red); }
  .small { font-size:11px; color:#8a887f; line-height:1.5; }
  @media (max-width:900px) { .app { grid-template-columns:minmax(0,1fr); } }
</style>
</head>
<body>
<main class="app">
  <div class="stage"><div id="stage"><div id="canvas-holder"></div></div></div>

  <div class="panel">
    <h1>力偶（couple）</h1>
    <p>兩個力：大小相等、方向相反、不沿同一條線。</p>

    <div class="btns">
      <button id="scan" type="button">掃描支點</button>
      <button id="reset" type="button">重設</button>
    </div>
    <div class="btns">
      <button id="eq-on" type="button" class="on">兩力相等</button>
      <button id="eq-off" type="button">兩力不等</button>
    </div>

    <div class="row">
      <label for="f1">左邊力 F₁</label>
      <input id="f1" type="range" min="10" max="100" step="1" value="50">
      <input class="val" id="f1-n" type="number" min="10" max="100" step="1" value="50" aria-label="F₁ 數值">
    </div>
    <div class="row hide" id="row-f2">
      <label for="f2">右邊力 F₂</label>
      <input id="f2" type="range" min="10" max="100" step="1" value="50">
      <input class="val" id="f2-n" type="number" min="10" max="100" step="1" value="50" aria-label="F₂ 數值">
    </div>
    <div class="row">
      <label for="d">兩力距離 d</label>
      <input id="d" type="range" min="0.2" max="2" step="0.05" value="1.2">
      <input class="val" id="d-n" type="number" min="0.2" max="2" step="0.05" value="1.2" aria-label="d 數值">
    </div>
    <div class="row">
      <label for="deg">斜角 θ</label>
      <input id="deg" type="range" min="0" max="60" step="1" value="0">
      <input class="val" id="deg-n" type="number" min="0" max="60" step="1" value="0" aria-label="θ 數值">
    </div>
    <div class="row">
      <label for="pivot">支點位置</label>
      <input id="pivot" type="range" min="0" max="3.6" step="0.05" value="1.8">
      <input class="val" id="pivot-n" type="number" min="0" max="3.6" step="0.05" value="1.8" aria-label="支點位置數值">
    </div>

    <div class="read">
      <div><span>M₁（左邊向上的力）</span><b id="o-m1">—</b></div>
      <div><span>M₂（右邊向下的力）</span><b id="o-m2">—</b></div>
      <div class="big"><span>合計 ΣM（對支點）</span><b id="o-sum">—</b></div>
      <div><span>兩作用點距離 d</span><b id="o-d">—</b></div>
      <div><span>垂直距離 d⊥</span><b id="o-dperp">—</b></div>
      <div class="big"><span>力偶矩 M = F × d⊥</span><b id="o-m">—</b></div>
      <div class="eq" id="o-eq">—</div>
    </div>
    <div class="key" id="o-key">力偶矩與支點位置無關</div>
    <div class="small">印刷定義：兩個力大小相等、方向相反、不共線；力偶矩 = 力 × 兩力作用線之間的垂直距離。UI 示範值：F 10–100 N、d 0.2–2.0 m、θ 0–60°；桿長 3.6 m 只作示意。</div>
  </div>
</main>

<script src="../p5.min.js"></script>
<script>
// 印刷只有定義與 M = F × d；下面 F 10–100、d 0.2–2.0、50、1.2、θ 0–60° 係 UI 示範值。
const L = 3.6;                       // 桿長（示意框，唔係印刷數值）
const PAD = 58;
const SCAN_MS = 2500;                // 掃描支點全程約 2.5 s
const C = {
  paper: [251, 250, 247], ink: [35, 35, 31], ink2: [99, 99, 90], line: [214, 208, 196],
  up: [47, 111, 191], down: [180, 122, 23], pivot: [58, 56, 50], green: [46, 125, 91],
  red: [176, 60, 44], faint: [186, 181, 170], perp: [124, 92, 168],
};
const S = {
  F1: 50, F2: 50, d: 1.2, pivot: 1.8, deg: 0, equal: true,
  scanning: false, scanT0: 0, resumeAt: null, trace: [],
};

// 同 centroid-hang 一致的數值格式：力矩 1 個小數位、長度 2 個小數位、力整數。
const mom = (v) => (Math.abs(v) < 0.05 ? '0.0' : (v > 0 ? '+' : '') + v.toFixed(1));
const momAbs = (v) => (Math.abs(v) < 0.05 ? '0.0' : Math.abs(v).toFixed(1));
const len2 = (v) => v.toFixed(2);
const deg0 = (v) => Math.round(v) + '°';
const sense = (v) => (v > 0.05 ? '逆時針' : v < -0.05 ? '順時針' : '無力矩');

const theta = () => (S.deg * Math.PI) / 180;
const xA = () => L / 2 - S.d / 2;        // 左邊向上的力
const xB = () => L / 2 + S.d / 2;        // 右邊向下的力
const FA = () => S.F1;
const FB = () => (S.equal ? S.F1 : S.F2);

function calc() {
  const th = theta();
  const c = Math.cos(th), s = Math.sin(th);
  const xa = xA(), xb = xB(), p = S.pivot;
  const Fa = FA(), Fb = FB();
  // 對支點 (p, 0) 取矩，逆時針為正：兩力都斜 θ，力的 y 分量 = F cos θ
  const m1 = (xa - p) * Fa * c;
  const m2 = -(xb - p) * Fb * c;
  const sum = m1 + m2;
  const dPerp = S.d * c;                 // 兩條作用線之間的垂直距離
  const M = Fa * dPerp;                  // 力偶矩（相等時 F₁ = F₂，就是 F × d⊥）
  return { th, c, s, xa, xb, p, Fa, Fb, m1, m2, sum, dPerp, M };
}

/* ---------- DOM ---------- */
const el = (id) => document.getElementById(id);
const fmtM = (v) => (Math.abs(v) < 0.05 ? '0.0 N·m（' + sense(v) + '）' : mom(v) + ' N·m（' + sense(v) + '）');

function syncUI() {
  const r = calc();
  el('o-m1').textContent = fmtM(r.m1);
  el('o-m2').textContent = fmtM(r.m2);
  el('o-sum').textContent = fmtM(r.sum);
  el('o-d').textContent = len2(S.d) + ' m';
  el('o-dperp').textContent = len2(r.dPerp) + ' m';
  el('o-m').textContent = momAbs(r.M) + ' N·m（' + sense(r.sum) + '）';
  el('f1-n').value = String(S.F1);
  el('d-n').value = S.d.toFixed(2);
  el('deg-n').value = String(S.deg);
  el('pivot-n').value = S.pivot.toFixed(2);
  el('f1').value = String(S.F1);
  el('d').value = String(S.d);
  el('deg').value = String(S.deg);
  el('pivot').value = String(Math.round(S.pivot * 20) / 20);
  el('row-f2').classList.toggle('hide', S.equal);
  el('f2-n').value = String(S.F2);
  el('f2').value = String(S.F2);
  el('eq-on').classList.toggle('on', S.equal);
  el('eq-off').classList.toggle('on', !S.equal);
  el('scan').classList.toggle('on', S.scanning);
  el('scan').textContent = S.scanning ? '暫停掃描' : '掃描支點';

  // A5 等式行
  const eq = el('o-eq');
  if (S.equal) {
    const name = S.deg > 0.5 ? 'd⊥' : 'd';
    eq.classList.remove('warn');
    eq.textContent = 'M = F ' + name + ' = ΣM = ' + momAbs(r.sum) + ' N·m（對任何支點）';
  } else {
    eq.classList.add('warn');
    eq.textContent = 'M = F₁ d⊥ = ' + momAbs(r.M) + ' N·m ≠ ΣM = ' + mom(r.sum) + ' N·m'
      + '（兩力不等 → 不是力偶，ΣM 隨支點改變）';
  }
  const key = el('o-key');
  key.classList.toggle('warn', !S.equal);
  key.textContent = S.equal ? '力偶矩與支點位置無關' : '兩力不等：ΣM 隨支點位置改變，不是力偶矩';

  // A2 逐點記錄（任何方式改支點都會記）
  if (!S.trace.length || Math.abs(S.trace[S.trace.length - 1].p - S.pivot) > 0.015) {
    S.trace.push({ p: S.pivot, sum: r.sum });
    if (S.trace.length > 900) S.trace.shift();
  }
}

function sync() {
  syncUI();
  if (typeof redraw === 'function') redraw();
}

function resetShape() {
  S.trace = [];
}

/* ---------- 畫布尺寸 ---------- */
function canvasSize() {
  const holder = el('canvas-holder');
  const w = Math.max(320, Math.floor(holder.clientWidth || 800));
  const h = Math.max(470, Math.min(620, window.innerHeight - 200, Math.round(w * 0.66) + 190));
  return { w, h };
}

function setup() {
  const { w, h } = canvasSize();
  createCanvas(w, h).parent('canvas-holder');
  noLoop();
  textFont('system-ui, sans-serif');
  sync();
}

function windowResized() {
  const { w, h } = canvasSize();
  resizeCanvas(w, h);
  sync();
}

/* ---------- 繪圖 ---------- */
let view = { ppm: 1, rowY: 0, padX: PAD };

function arrow(ax, ay, ux, uy, len, colour, label, side) {
  const tx = ax + ux * len, ty = ay + uy * len;
  stroke(...colour); strokeWeight(3); strokeCap(ROUND);
  line(ax, ay, tx, ty);
  noStroke(); fill(...colour);
  const nx = -uy, ny = ux, hh = 11, hw = 6.5;
  triangle(tx + ux * 2, ty + uy * 2,
    tx - ux * hh + nx * hw, ty - uy * hh + ny * hw,
    tx - ux * hh - nx * hw, ty - uy * hh - ny * hw);
  if (label) {
    // 標籤貼在箭桿旁邊（左邊力放左、右邊力放右），唔會撞下面的尺寸線
    fill(...C.ink); textSize(12);
    if (side < 0) { textAlign(RIGHT, CENTER); text(label, ax - 12, ay + uy * len * 0.55); }
    else { textAlign(LEFT, CENTER); text(label, ax + 12, ay + uy * len * 0.55); }
  }
}

function rightAngle(cx, cy, ux, uy, vx, vy, s) {
  noFill(); stroke(...C.ink2); strokeWeight(1.2);
  const ax = cx + ux * s, ay = cy + uy * s;
  const bx = ax + vx * s, by = ay + vy * s;
  const dx = cx + vx * s, dy = cy + vy * s;
  beginShape(); vertex(ax, ay); vertex(bx, by); vertex(dx, dy); endShape();
}

// 每一格：先推進掃描（只改狀態與讀數，唔喺 draw 內再叫 redraw），再畫
function draw() {
  if (S.scanning) {
    const k = Math.min(1, (performance.now() - S.scanT0) / SCAN_MS);
    S.pivot = Math.round(k * L * 100) / 100;
    if (k >= 1) { S.scanning = false; noLoop(); }
    syncUI();
  }
  drawScene();
}

function drawScene() {
  const W = width, H = height;
  const r = calc();
  const ppm = (W - PAD * 2) / L;
  const rodY = Math.round(H * 0.285);
  view = { ppm, rowY: rodY, padX: PAD };
  const px = (x) => PAD + x * ppm;

  background(...C.paper);

  const ux = r.s, uy = -r.c;              // 螢幕方向：向上（左邊力）；右邊力相反
  const nx = r.c, ny = r.s;               // 垂直於作用線（螢幕）

  // 桿
  stroke(138, 106, 69); strokeWeight(7); strokeCap(ROUND);
  line(px(0), rodY, px(L), rodY);
  noStroke(); fill(138, 106, 69);
  circle(px(0), rodY, 9); circle(px(L), rodY, 9);

  const ax = px(r.xa), bx = px(r.xb);
  const lenA = 26 + 58 * (r.Fa / 100);
  const lenB = 26 + 58 * (r.Fb / 100);

  // 作用線（斜的時候畫出來，兩條平行）
  if (S.deg > 0.5) {
    stroke(...C.faint); strokeWeight(1); drawingContext.setLineDash([5, 5]);
    for (const x of [ax, bx]) line(x - ux * 120, rodY - uy * 120, x + ux * 150, rodY + uy * 150);
    drawingContext.setLineDash([]);
  }

  // 兩支力
  arrow(ax, rodY, ux, uy, lenA, C.up, 'F₁ = ' + r.Fa + ' N', -1);
  arrow(bx, rodY, -ux, -uy, lenB, C.down, 'F₂ = ' + r.Fb + ' N', +1);

  // d⊥：由 A 垂直量到 B 的作用線，兩端畫直角（θ = 0 時 d⊥ 就是桿上的 d，唔重複畫）
  if (S.deg > 0.5) {
    const dPerpPx = (bx - ax) * r.c;
    const fx = ax + nx * dPerpPx, fy = rodY + ny * dPerpPx;
    stroke(...C.perp); strokeWeight(1.6); drawingContext.setLineDash([6, 4]);
    line(ax, rodY, fx, fy);
    drawingContext.setLineDash([]);
    rightAngle(ax, rodY, ux, uy, nx, ny, 9);
    rightAngle(fx, fy, ux, uy, -nx, -ny, 9);
    noStroke(); fill(...C.perp); textAlign(CENTER, CENTER); textSize(12);
    text('d⊥ = ' + len2(r.dPerp) + ' m', (ax + fx) / 2 + nx * 26, (rodY + fy) / 2 + ny * 26);
  }

  // 兩作用點距離 d（沿桿，畫在桿下）
  const dY = rodY + (S.deg > 0.5 ? 112 : 84);
  stroke(...C.line); strokeWeight(1);
  line(ax, dY, bx, dY);
  for (const x of [ax, bx]) line(x, dY - 7, x, dY + 7);
  noStroke(); fill(...C.ink2); textAlign(CENTER, TOP); textSize(12);
  text((S.deg > 0.5 ? '作用點距離 d = ' : 'd = ') + len2(S.d) + ' m', (ax + bx) / 2, dY + 8);

  // 支點（可拖）
  const pvx = px(S.pivot);
  noStroke(); fill(...C.paper); circle(pvx, rodY, 15);
  fill(...C.pivot); circle(pvx, rodY, 9);
  fill(...C.ink2); textAlign(CENTER, BOTTOM); textSize(11);
  text('支點 ' + len2(S.pivot) + ' m', pvx, rodY - 13);

  // 轉向（順時針 = 右邊沉）：畫在桿下，箭咀指向上，唔會蓋住「支點」標籤
  const rad = 46;
  noFill(); stroke(...C.green); strokeWeight(1.8);
  arc(pvx, rodY, rad * 2, rad * 2, 0, PI);
  noStroke(); fill(...C.green);
  triangle(pvx - rad - 5, rodY - 2, pvx - rad + 5, rodY - 2, pvx - rad, rodY - 12);

  // 頂部：定義式
  noStroke();
  const dist = S.deg > 0.5 ? len2(r.dPerp) : len2(S.d);
  const topLine = S.equal
    ? '力偶矩 M = 力 × ' + (S.deg > 0.5 ? '作用線間垂直距離' : '兩力的垂直距離') + ' = ' + r.Fa + ' × ' + dist + ' = ' + momAbs(r.M) + ' N·m'
    : 'M = F₁ × d⊥ = ' + r.Fa + ' × ' + dist + ' = ' + momAbs(r.M) + ' N·m（兩力不等：不是力偶）';
  if (W < 640) {
    textAlign(LEFT, TOP); textSize(12); fill(...C.ink);
    text(topLine, 16, 10);
    textSize(11); fill(...C.ink2);
    text('θ = ' + deg0(S.deg) + ' · 支點 ' + len2(S.pivot) + ' m', 16, 28);
  } else {
    textAlign(LEFT, TOP); textSize(13); fill(...C.ink);
    text(topLine, 22, 16);
    textAlign(RIGHT, TOP); textSize(12); fill(...C.ink2);
    text('θ = ' + deg0(S.deg) + ' · 支點位置 ' + len2(S.pivot) + ' m（可拖）', W - 22, 16);
  }

  // 力矩條 M₁ / M₂ / ΣM
  const maxAbs = Math.max(Math.abs(r.m1), Math.abs(r.m2), Math.abs(r.sum), 1);
  const scale = (W / 2 - 104) / maxAbs;
  const zeroX = W / 2;
  const barTop = Math.round(H * 0.585);
  const barH = 15, gap = 25;
  stroke(...C.line); strokeWeight(1);
  line(zeroX, barTop - 8, zeroX, barTop + 2 * gap + barH + 8);
  for (const [i, row] of [
    { label: 'M₁', v: r.m1, colour: C.up },
    { label: 'M₂', v: r.m2, colour: C.down },
    { label: 'ΣM', v: r.sum, colour: C.green },
  ].entries()) {
    const y = barTop + i * gap;
    const w = row.v * scale;
    noStroke(); fill(...row.colour);
    if (w >= 0) rect(zeroX, y, Math.max(1.5, w), barH, 2);
    else rect(zeroX + w, y, Math.max(1.5, -w), barH, 2);
    fill(...C.ink); textAlign(LEFT, CENTER); textSize(11);
    text(row.label, 24, y + barH / 2);
    textAlign(w >= 0 ? RIGHT : LEFT, CENTER);
    text(mom(row.v) + ' N·m', w >= 0 ? zeroX - 8 : zeroX + 8, y + barH / 2);
  }

  // A2：ΣM 對支點位置的小圖
  drawTrace(W, H, r, barTop + 2 * gap + barH + 30);

  // 底部：核心句
  textAlign(CENTER, BOTTOM); textSize(14);
  fill(...(S.equal ? C.green : C.red));
  text(S.equal ? '力偶矩與支點位置無關' : '兩力不等就不是力偶：ΣM 隨支點改變', W / 2, H - 12);
}

function drawTrace(W, H, r, top) {
  const boxW = Math.min(280, Math.max(210, W * 0.42));
  const boxH = Math.min(104, Math.max(74, H - top - 40));
  const x0 = 20, y0 = Math.min(top, H - boxH - 34);
  const plotL = x0 + 30, plotR = x0 + boxW, plotT = y0 + 10, plotB = y0 + boxH - 20;
  const midY = (plotT + plotB) / 2;

  // 圖名放在框外（上面），框內只留刻度和線
  noStroke(); fill(...C.ink2); textSize(9.5);
  textAlign(LEFT, BOTTOM); text('ΣM (N·m)', x0 + 2, y0 - 4);
  textAlign(RIGHT, BOTTOM); text('支點位置 (m)', plotR, y0 - 4);

  stroke(...C.line); strokeWeight(1);
  noFill(); rect(x0, y0, boxW, boxH, 4);

  const maxV = Math.max(20, ...S.trace.map((t) => Math.abs(t.sum)), Math.abs(r.sum));
  const yMax = 20 * Math.ceil(maxV / 20 + 0.4);
  const mx = (p) => plotL + (p / L) * (plotR - plotL);
  const my = (v) => midY - (v / yMax) * ((plotB - plotT) / 2);

  // 零線
  stroke(...C.faint); strokeWeight(1); drawingContext.setLineDash([3, 3]);
  line(plotL, midY, plotR, midY);
  drawingContext.setLineDash([]);
  // 座標軸
  stroke(...C.line);
  line(plotL, plotT, plotL, plotB);
  line(plotL, plotB, plotR, plotB);
  noStroke(); fill(...C.ink2); textSize(9.5);
  textAlign(RIGHT, CENTER); text('+' + yMax, plotL - 4, plotT + 4);
  textAlign(RIGHT, CENTER); text('0', plotL - 4, midY);
  textAlign(RIGHT, CENTER); text('−' + yMax, plotL - 4, plotB - 4);
  textAlign(CENTER, TOP); textSize(9);
  text('0', plotL, plotB + 3); text('1.8', mx(1.8), plotB + 3); text('3.6', plotR, plotB + 3);

  // 逐點（掃描或拖支點時累積）：點連成線，只畫掃過的範圍
  if (S.trace.length > 1) {
    stroke(...C.green); strokeWeight(1.6); noFill();
    drawingContext.setLineDash([]);
    beginShape();
    for (const t of S.trace) vertex(mx(t.p), my(t.sum));
    endShape();
  }
  noStroke(); fill(...C.green);
  for (const t of S.trace) circle(mx(t.p), my(t.sum), 3.2);

  // 現在位置
  stroke(...C.pivot); strokeWeight(1.2);
  line(mx(S.pivot), plotT, mx(S.pivot), plotB);
}

/* ---------- 互動 ---------- */
function setPivotFromMouse() {
  const x = Math.min(L, Math.max(0, (mouseX - view.padX) / view.ppm));
  S.pivot = Math.round(x * 20) / 20;
  sync();
}

function mousePressed() { stopScan(); setPivotFromMouse(); }
function mouseDragged() { setPivotFromMouse(); }

function startScan() {
  // 首次按：由左端掃到右端；中途暫停後再按，就由暫停位置續掃
  const from = (S.resumeAt != null && S.resumeAt > 0.005 && S.resumeAt < L - 0.005) ? S.resumeAt : 0;
  if (from === 0) { S.pivot = 0; S.trace = []; }
  S.resumeAt = null;
  S.scanning = true;
  S.scanT0 = performance.now() - (from / L) * SCAN_MS;
  sync();
  loop();
}

function stopScan() {
  if (!S.scanning) return;
  S.scanning = false;
  S.resumeAt = S.pivot;
  noLoop();
  sync();
}

el('scan').addEventListener('click', () => (S.scanning ? stopScan() : startScan()));
el('reset').addEventListener('click', () => {
  S.resumeAt = null;
  stopScan();
  S.F1 = 50; S.F2 = 50; S.d = 1.2; S.pivot = 1.8; S.deg = 0; S.equal = true;
  resetShape();
  sync();
});
el('eq-on').addEventListener('click', () => { S.resumeAt = null; S.equal = true; resetShape(); sync(); });
el('eq-off').addEventListener('click', () => { S.resumeAt = null; S.equal = false; resetShape(); sync(); });

const bindSlider = (id, key, after) => {
  el(id).addEventListener('input', (e) => {
    S.resumeAt = null;
    S[key] = Number(e.target.value);
    if (after) after();
    resetShape();
    sync();
  });
};
bindSlider('f1', 'F1', () => { if (S.equal) S.F2 = S.F1; });
bindSlider('f2', 'F2');
bindSlider('d', 'd');
bindSlider('deg', 'deg');
bindSlider('pivot', 'pivot', () => stopScan());

const bindNumber = (id, key, min, max, step, after) => {
  const apply = () => {
    const raw = Number(el(id).value);
    if (!Number.isFinite(raw)) { syncUI(); return; }
    let v = Math.min(max, Math.max(min, raw));
    v = Math.round(v / step) * step;
    v = Math.min(max, Math.max(min, Number(v.toFixed(4))));
    S.resumeAt = null;
    S[key] = v;
    if (after) after();
    resetShape();
    sync();
  };
  el(id).addEventListener('change', apply);
  el(id).addEventListener('blur', apply);
};
bindNumber('f1-n', 'F1', 10, 100, 1, () => { if (S.equal) S.F2 = S.F1; });
bindNumber('f2-n', 'F2', 10, 100, 1);
bindNumber('d-n', 'd', 0.2, 2, 0.05);
bindNumber('deg-n', 'deg', 0, 60, 1);
bindNumber('pivot-n', 'pivot', 0, 3.6, 0.05, () => stopScan());

sync();
</script>
</body>
</html>
